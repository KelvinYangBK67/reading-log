{% extends "base.html" %}

{% block content %}
  <div class="form-page form-page--compact">
    <header class="form-heading">
      <p class="eyebrow">{{ book.title }}</p>
      <h1>{{ page_title }}</h1>
    </header>

    <form class="book-form" method="post">
      <div class="field">
        <label for="{{ field_name }}">{{ field_label }} <span class="optional">選填</span></label>
        <input id="{{ field_name }}" name="{{ field_name }}" type="date" value="{{ field_value }}" autofocus>
        <p class="field-note">日期已預設為今天；如不需要，也可以留空。</p>
      </div>
      {% if record_value is defined %}
        <div class="field">
          <label for="record">記錄 <span class="optional">選填</span></label>
          <textarea id="record" name="record" rows="8" placeholder="寫下讀完後的感受……">{{ record_value }}</textarea>
        </div>
      {% endif %}
      <div class="form-actions">
        <button class="button button--primary" type="submit">{{ submit_label }}</button>
        <a class="button button--plain" href="{{ url_for('index') }}">取消</a>
      </div>
    </form>
  </div>
{% endblock %}
